        body {
            font-family: Arial, sans-serif;
            background-color: #F2F2F2;
            color: #333333;
            margin: 0;
            padding: 20px;
            width: 100%;
        }

        figure {
            display: inline-block;
            background-color: #ffffff;
            margin-left: auto;
            margin-right: auto;
            padding: 10px;
            border: 1px solid #dddddd;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
            width: 250px;
            height: 250px;
        }

        figcaption {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #555555;
        }
        img{
            width: 100px;
            height: 100px;
        }

    </style>
