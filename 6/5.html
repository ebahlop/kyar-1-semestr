<!DOCTYPE html>
<html lang="ru">
<head>
    <style>

        .map-container {
            display: inline-block;
            border: 3px solid #3a414e;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        img {
            display: block;
            width: 832px;
            height: 732px;
        }
    </style>
</head>
<body>

    <div class="map-container">
        <img src="5/FULL.jpg" usemap="#dota2items" alt="Финальный экран матча Dota 2">
    </div>

    <!-- Описание интерактивных зон (карты) -->
    <map name="dota2items">
        <!-- 1. Eye of Skadi (Скади) -->
        <area shape="rect" coords="552,304,487,255" href="5/SKADI.jpg" alt="Eye of Skadi" title="Посмотреть Eye of Skadi">
        
        <!-- 2. Black King Bar (BKB) -->
        <area shape="rect" coords="559,254,625,301" href="5/BKB.jpg" alt="Black King Bar" title="Посмотреть Black King Bar">
        
        <!-- 3. Manta Style (Манта) -->
        <area shape="rect" coords="639,255,707,302" href="5/MANTA.jpg" alt="Manta Style" title="Посмотреть Manta Style">
        
        <!-- 4. Assault Cuirass (Кираса) -->
        <area shape="rect" coords="555,364,484,311"  href="5/CUIRASS.jpg" alt="Assault Cuirass" title="Посмотреть Assault Cuirass">
        
        <!-- 5. Butterfly (Бабочка) — Опечатка в названии исправлена -->
        <area shape="rect" coords="565,311,630,360" href="5/BUTTERFKY.jpg" alt="Butterfly" title="Посмотреть Butterfly">
        
        <!-- 6. Monkey King Bar (MKB) -->
        <area shape="rect" coords="641,312,707,361" href="5/MKB.jpg" alt="Monkey King Bar" title="Посмотреть Monkey King Bar">
    </map>

</body>
</html>
