<!DOCTYPE html>
<html>
    <head>
        <style>
            body{
                background-color: indigo;
                font-size: 1.2em;
            }
            input[type="text"], input[type="email"], input[type="date"], select{
                width: 55%;
                padding: 5px;
                box-sizing: border-box;
                border: 1px solid #ccc;
            }
            input[type="text"]:focus {
                background-color: white;
                color: black;
            }
            label{
                width: 40%;
            }
            form{
                width: 700px;
            }
            input[type="text"], input[type="email"] {
                background-color: rgba(255, 255, 255, .5);
                color: rgba(255, 255, 255, 1);
                box-shadow: inset 0 0 10px rgba(255, 255, 255, .75);
            }
            div {
                display: flex;
                justify-content: space-between;
                margin-bottom: 15px;
            }
            button{
                background-color: navy;
                box-shadow: 0 0 4px white;
                color: white;
            }
            .button{
                display: flex;
                justify-self: right;
                padding-right: 50px;
            }
        </style>
    </head>
    <body>
        <h3>Регистрация</h3>
        <form>
        <div>
            <label for="last-name">Фамилия:</label>
            <input type="text" id="last-name" name="last-name">
        </div>

        <div>
            <label for="first-name">Имя:</label>
            <input type="text" id="first-name" name="first-name">
        </div>

        <div>
            <label for="middle-name">Отчество:</label>
            <input type="text" id="middle-name" name="middle-name">
        </div>

        <div>
            <label for="age">Ваш возраст:</label>
            <input type="text" id="age" name="age">
        </div>

        <div>
            <label>Пол:</label>
            <div style="width: 55%; display: flex; gap: 10px; align-items: center; font-size: 0.9em;">
                <label style="width: auto;"><input type="checkbox" name="gender" value="male"> мужской</label>
                <label style="width: auto;"><input type="checkbox" name="gender" value="female"> женский</label>
            </div>-
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" name="email">
        </div>

        <div>
            <label for="country">Страна проживания:</label>
            <input type="text" name="country">
        </div>

        <div>
            <label for="source">Откуда вы узнали о нас?</label>
            <select name="source">
                <option value="">Выберите вариант</option>
                <option value="internet">Интернет</option>
                <option value="friends">От друзей</option>
                <option value="ads">Реклама</option>
            </select>
        </div>

        <div>
            <label for="date">Дата заполнения:</label>
            <input type="date" name="date">
        </div>

        <div class="button">
            <button>Регистрация</button>
            <button>Отмена</button>
        </div>
        </form>
    </body>
</html>
