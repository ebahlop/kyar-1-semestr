<!DOCTYPE html>
<html>
    <head>
        <style>
            table{
                border-collapse: separate;
                empty-cells: hide;
                border-spacing: 2px;
                font-weight: bold;
            }
            td{
                text-align: center;
                vertical-align: middle;
                border: 1px solid black;
            }
            th{
                border: 1px solid black;
                background-color: blue;
                color: #ffffff;
                font-size: 1.2em;
            }
            td:nth-child(2){
                background-color: #06cdff;
                color: #ffffff
            }
            td:nth-child(3){
                background-color: #dc08f0;
                color: #ffffff
            }
            td:nth-child(4){
                background-color: #065e03;
                color: #ffffff
            }

        </style>
    </head>
    <body>
        <div style="text-align: center; max-width: 400px; margin: 0px">
            <h2>Russia: Top smartphone vendors</h2>
            <h3>Q1 2021</h3>
        </div>
        <table>
            <tr>
                <td></td>
                <th>Vendor</th>
                <th>Unit<br>share</th>
                <th>Annual<br>growth</th>
            </tr>
            <tr>
                <td>#1 ⇑</td>
                <td>Xiaomi</td>
                <td>32%</td>
                <td>+125%</td>
            </tr>
            <tr>
                <td>#2 ⇑</td>
                <td>Samsung</td>
                <td>27%</td>
                <td>+41%</td>
            </tr>
            <tr>
                <td>#3 ⇑</td>
                <td>Honor</td>
                <td>10%</td>
                <td>0%</td>
            </tr>
            <tr>
                <td>#4 ⇔</td>
                <td>Apple</td>
                <td>9%</td>
                <td>+24%</td>
            </tr>
            <tr>
                <td>#5 ⇔</td>
                <td>Realme</td>
                <td>9%</td>
                <td>+682%</td>
            </tr>
            <tr>
                <td></td>
                <td>Total</td>
                <td>82%</td>
                <td>682%</td>
            </tr>

        </table>
    </body>
</html>
